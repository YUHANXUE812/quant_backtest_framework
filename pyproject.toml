[project]
name = "a-share-momentum-backtester"
version = "0.1.0"
description = "Research framework for A-share momentum-factor robustness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.19,<2",
    "baostock>=0.9.4,<1",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

